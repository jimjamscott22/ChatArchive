[project]
name = "chatarchive-backend"
version = "0.1.0"
description = "FastAPI backend for ChatArchive"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.36",
    "supabase>=2.0.0",
    "tiktoken>=0.7.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
